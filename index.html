<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--navy:#031636;--blue:#0058be;--ink:#191c1d;--muted:#44474e;--line:#e1e3e4;--bg:#f8f9fa;--green:#10b981;--amber:#f59e0b;--red:#ef4444}*{box-sizing:border-box}body{margin:0;font:14px Inter,Arial;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 75% 12%,#dbeafe 0,transparent 26%),var(--bg)}.auth-card{width:min(100%,512px);background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px;box-shadow:0 12px 32px #0f172a12}.brand{text-align:center}.crest{display:inline-grid;place-items:center;width:48px;height:42px;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;letter-spacing:-1px}.brand h1{font-size:30px;margin:12px 0 6px}.brand p,.sub{color:var(--muted);margin:0}.role-tabs{display:flex;gap:8px;background:var(--bg);padding:5px;border-radius:10px;margin:24px 0}.role-tabs button{flex:1;padding:10px;border-radius:7px;background:transparent}.role-tabs .active{background:#fff;color:var(--blue);box-shadow:0 1px 3px #0001;font-weight:700}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:600}.field input,.field select,.field textarea,.search{padding:13px;border:1px solid #c5c6cf;border-radius:8px;background:#fff;width:100%;outline-color:var(--blue)}.field textarea{min-height:100px;resize:vertical}.primary{background:var(--blue);color:#fff;border-radius:8px;padding:12px 18px;font-weight:700}.secondary{background:#fff;border:1px solid #c5c6cf;border-radius:8px;padding:11px 16px;font-weight:700}.wide{width:100%;margin-top:12px}.switch{text-align:center;color:var(--muted);margin:18px 0 0}.link{color:var(--blue);font-weight:700;cursor:pointer}.app{min-height:100vh;padding-left:280px}.sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;background:var(--navy);padding:24px 12px;color:#fff;display:flex;flex-direction:column;z-index:5;box-shadow:0 8px 26px #0003}.side-brand{display:flex;gap:12px;align-items:center;padding:0 12px 48px}.side-brand b{font-size:20px}.side-brand small{display:block;color:#ffffffb5;margin-top:4px}.nav{display:grid;gap:4px}.nav button{background:transparent;color:#ffffffb5;text-align:left;padding:13px 24px;border-radius:8px;font-weight:600}.nav button.active{background:#0058be22;color:#fff;border-left:4px solid var(--blue);padding-left:20px}.logout{margin-top:auto}.main{padding:40px 32px;max-width:1600px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:36px}.page-head h1{font-size:38px;letter-spacing:-1px;margin:0 0 7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px #0000000d}.stat{padding:23px;border-top:4px solid var(--blue)}.stat.amber{border-color:var(--amber)}.stat.green{border-color:var(--green)}.stat.gray{border-color:#75777f}.stat label{color:var(--muted);font-size:12px;letter-spacing:.7px;font-weight:700}.stat strong{display:block;font-size:32px;margin:9px 0}.stat span{color:var(--muted)}.grid2{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:24px}.panel{padding:24px}.panel h2{font-size:18px;margin:0 0 18px}.activity,.notification{padding:14px 0;border-bottom:1px solid var(--line)}.activity:last-child,.notification:last-child{border:0}.activity b{display:block}.muted{color:var(--muted);font-size:12px;margin-top:5px}.stepper{display:flex;gap:10px;align-items:center;margin-bottom:22px;color:var(--muted);font-weight:600}.stepper i{width:24px;height:24px;border-radius:50%;border:1px solid var(--muted);font-style:normal;display:grid;place-items:center}.stepper .on{background:var(--navy);color:#fff;border-color:var(--navy)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.pill{border:1px solid #c5c6cf;border-radius:999px;background:#fff;padding:10px 18px}.pill.active{background:var(--blue);color:#fff;border-color:var(--blue)}.officials{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.official{padding:24px;min-height:245px;display:flex;flex-direction:column}.avatar{width:56px;height:56px;border-radius:50%;background:#e0edff;color:var(--blue);display:grid;place-items:center;font-size:19px;font-weight:800}.official-top{display:flex;gap:16px;align-items:center}.official h3{margin:0;font-size:18px}.badge{border-radius:5px;padding:4px 8px;font-size:12px;font-weight:600;display:inline-block}.available,.APPROVED{background:#dcfce7;color:#166534}.PENDING{background:#fef3c7;color:#92400e}.REJECTED{background:#fee2e2;color:#991b1b}.COMPLETED{background:#e5e7eb;color:#374151}.official footer{border-top:1px solid var(--line);padding-top:15px;margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}.appointment-form{max-width:960px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.table th{background:#f8f9fa;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px}.notice{background:#eff6ff;color:#1e40af;padding:14px;border-radius:8px;margin:16px 0}.modal{position:fixed;inset:0;background:#03163699;display:grid;place-items:center;padding:20px;z-index:10}.modal-box{background:#fff;width:min(100%,620px);max-height:90vh;overflow:auto;border-radius:14px;padding:26px}.toast{position:fixed;right:22px;bottom:22px;background:var(--navy);color:white;padding:14px 18px;border-radius:8px;box-shadow:0 8px 20px #0003;z-index:20}.notification.unread{border-left:3px solid var(--blue);padding-left:12px;background:#f8fbff}.hamb{display:none}@media(max-width:900px){.app{padding-left:0}.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.hamb{display:block}.main{padding:24px 16px}.stats,.officials{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.page-head h1{font-size:30px}}@media(max-width:560px){.form-grid,.stats,.officials{grid-template-columns:1fr}.auth-card{padding:24px}.page-head{align-items:flex-start;flex-direction:column}.stepper{font-size:11px}}
</style></head><body><div id="root"></div><script>
const state={role:'student',mode:'login',user:null,view:'dashboard',officials:[],appointments:[],dashboard:{},notifications:[],filter:'All',selectedOfficial:null};
const departments=['Information Technology','Computer Science','Engineering','Administration','Examinations','Student Affairs','Finance'];const designations=['Staff','HOD','Dean','Principal','Director','Other Official'];
const $=s=>doconst SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzc-bMkm1Rnn_Ebm8ojwSRhmICpuKWxx4ZXwHXB45y156C7dpX5CVZJJb_sfc6JCOSq2g/exec";

async function run(fn, data) {
  try {
    const response = await fetch(SCRIPT_URL + "?action=" + fn, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8",
      },
      body: JSON.stringify(data)
    });
    return await response.json();
  } catch (error) {
    console.error(error);
    return { success: false, message: "Network error connecting to the database." };
  }
}cument.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),3500)}
function fields(names){return names.map(([n,l,t='text',opts])=>`<div class="field"><label>${l}</label>${t==='select'?`<select name="${n}">${opts.map(x=>`<option>${x}</option>`).join('')}</select>`:t==='textarea'?`<textarea name="${n}"></textarea>`:`<input required name="${n}" type="${t}" placeholder="${l}">`}</div>`).join('')}
function render(){ $('#root').innerHTML=state.user?app():auth(); bind(); }
function auth(){let official=state.role==='official', signup=state.mode==='signup';let f=signup?(official?[['name','Full Name'],['employeeId','Employee ID'],['email','Official Email','email'],['contactNumber','Contact Number','tel'],['designation','Designation','select',designations],['department','Department','select',departments],['password','Password','password'],['confirmPassword','Confirm Password','password']]:[['name','Student Name'],['registerNumber','Register Number'],['department','Department','select',departments],['year','Year','select',['I','II','III','IV','V']],['email','Institutional Email','email'],['contactNumber','Contact Number','tel'],['password','Password','password'],['confirmPassword','Confirm Password','password']]):[['email','Email','email'],['password','Password','password']];return `<main class="auth"><section class="auth-card"><div class="brand"><span class="crest">MIT</span><h1>MIT CAMPUS AMS</h1><p>${signup?'Create your campus account':'Welcome back to your appointment portal'}</p></div><div class="role-tabs"><button data-role="student" class="${!official?'active':''}">Student</button><button data-role="official" class="${official?'active':''}">Official</button></div><form id="authForm"><div class="form-grid">${fields(f)}</div><button class="primary wide">${signup?'Create Account':'Log In'}</button></form><p class="switch">${signup?'Already registered?':'New here?'} <span class="link" id="switchMode">${signup?'Log in':'Create an account'}</span></p></section></main>`}
function app(){return `<div class="app"><aside class="sidebar"><div class="side-brand"><span class="crest">MIT</span><div><b>${state.role==='student'?'Student Portal':'Official Panel'}</b><small>${esc(state.user.Name||state.user.name)}</small></div></div><nav class="nav">${nav().map(x=>`<button data-view="${x[0]}" class="${state.view===x[0]?'active':''}">${x[1]}</button>`).join('')}</nav><button class="nav logout" id="logout">↪ Logout</button></aside><main class="main">${page()}</main></div>`}
function nav(){return state.role==='student'?[['dashboard','▦ Dashboard'],['request','＋ Request Appointment'],['appointments','◫ My Appointments'],['notifications','♧ Notifications'],['profile','◉ Profile']]:[['dashboard','▦ Dashboard'],['appointments','☷ Appointment Requests'],['availability','◷ Availability'],['notifications','♧ Notifications'],['profile','◉ Profile']]}
function page(){return state.view==='dashboard'?dashboard():state.view==='request'?request():state.view==='appointments'?appointments():state.view==='notifications'?notifications():state.view==='availability'?availability():profile()}
function dashboard(){let d=state.dashboard||{}, off=state.role==='official';return `<header class="page-head"><div><button class="secondary hamb" id="menu">☰</button><h1>Welcome, ${esc(state.user.Name)}</h1><p class="sub">${off?'Manage incoming requests and your schedule.':'Here is an overview of your appointment activity.'}</p></div>${!off?'<button class="primary" data-view="request">＋ Request New Appointment</button>':''}</header><section class="stats"><div class="card stat amber"><label>${off?'NEW':'PENDING'} REQUESTS</label><strong>${d.pending||0}</strong><span>Awaiting action</span></div><div class="card stat green"><label>APPROVED</label><strong>${d.approved||0}</strong><span>Ready to attend</span></div><div class="card stat"><label>${off?'TODAY':'NEXT'} APPOINTMENT</label><strong>${d.today||d.upcoming?.length||0}</strong><span>${d.upcoming?.[0]?esc(d.upcoming[0].AllocatedDate+' '+d.upcoming[0].AllocatedTime):'Nothing scheduled'}</span></div><div class="card stat gray"><label>COMPLETED</label><strong>${d.completed||0}</strong><span>This semester</span></div></section><section class="grid2"><div class="card panel"><h2>Recent Activity</h2>${(d.recent||[]).length?(d.recent||[]).map(a=>`<div class="activity"><b>${esc(a.Purpose)} <span class="badge ${a.Status}">${a.Status}</span></b><div class="muted">${esc(a.OfficialName||a.StudentName)} · ${esc(a.CreatedAt)}</div></div>`).join(''):'<p class="sub">No appointment activity yet.</p>'}</div><div class="card panel"><h2>Notifications</h2>${state.notifications.slice(0,4).map(n=>`<div class="activity"><b>${esc(n.Title)}</b><div class="muted">${esc(n.Message)}</div></div>`).join('')||'<p class="sub">You are all caught up.</p>'}</div></section>`}
function request(){let cards=state.officials.filter(o=>(state.filter==='All'||o.Designation===state.filter)&&(!state.query||(o.Name+' '+o.Department).toLowerCase().includes(state.query.toLowerCase())));return `<div class="stepper"><i class="on">1</i> Select Official <b>›</b><i>2</i> Choose Time <b>›</b><i>3</i> Confirm Details</div><header class="page-head"><div><h1>Who would you like to meet?</h1><p class="sub">Select an official or department to schedule your appointment.</p></div></header><input class="search" id="officialSearch" placeholder="Search by name or department" value="${esc(state.query||'')}"><div class="filters">${['All',...designations].map(x=>`<button class="pill ${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><section class="officials">${cards.map(o=>`<article class="card official"><div class="official-top"><div class="avatar">${esc(o.Name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div><h3>${esc(o.Name)}</h3><span class="badge available">Available</span><p class="sub">${esc(o.Designation)}<br>${esc(o.Department)}</p></div></div><footer><span>◷ Available for appointments</span><button class="primary" data-select="${o.OfficialID}">Select</button></footer></article>`).join('')||'<p class="sub">No registered officials match your search.</p>'}</section>`}
function appointmentForm(){let o=state.selectedOfficial;return `<div class="stepper"><i class="on">1</i> Select Official <b>›</b><i class="on">2</i> Choose Time <b>›</b><i>3</i> Confirm Details</div><header class="page-head"><div><h1>Request an appointment</h1><p class="sub">Meeting with <b>${esc(o.Name)}</b> · ${esc(o.Designation)}, ${esc(o.Department)}</p></div><button class="secondary" data-view="request">Change official</button></header><form id="appointmentForm" class="card panel appointment-form"><div class="form-grid">${fields([['purpose','Purpose','select',['Academic Discussion','Project Discussion','Leave / Permission','Department Matter','Personal Discussion','Other']],['requestedDate','Preferred Date','date'],['preferredTime','Preferred Time','time']])}</div>${fields([['description','Description','textarea']])}<div class="notice">The preferred date and time are subject to confirmation by the official.</div><button class="primary">Review & Submit Request</button></form>`}
function appointments(){let off=state.role==='official';return `<header class="page-head"><div><h1>${off?'Appointment Requests':'My Appointments'}</h1><p class="sub">${off?'Review, approve, or schedule student requests.':'Track every request and confirmed meeting.'}</p></div></header><div class="card panel table-wrap"><table class="table"><thead><tr><th>${off?'Student':'Official'}</th><th>Purpose</th><th>Preferred</th><th>Status</th><th>Details</th><th>Actions</th></tr></thead><tbody>${state.appointments.map(a=>`<tr><td><b>${esc(off?a.StudentName:a.OfficialName)}</b></td><td>${esc(a.Purpose)}</td><td>${esc(a.RequestedDate)} ${esc(a.PreferredTime)}</td><td><span class="badge ${a.Status}">${a.Status}</span></td><td>${a.AllocatedDate?esc(a.AllocatedDate+' '+a.AllocatedTime):'—'}</td><td>${off&&a.Status==='PENDING'?`<button class="primary" data-schedule="${a.AppointmentID}">Approve & Schedule</button> <button class="secondary" data-reject="${a.AppointmentID}">Reject</button>`:esc(a.Remarks||'—')}</td></tr>`).join('')||'<tr><td colspan="6">No appointments yet.</td></tr>'}</tbody></table></div>`}
function notifications(){return `<header class="page-head"><div><h1>Notifications</h1><p class="sub">Stay up to date with your appointment activity.</p></div><button class="secondary" id="readAll">Mark all as read</button></header><section class="card panel">${state.notifications.map(n=>`<div class="notification ${n.IsRead!=='TRUE'?'unread':''}"><b>${esc(n.Title)}</b><p>${esc(n.Message)}</p><div class="muted">${esc(n.CreatedAt)}</div></div>`).join('')||'<p class="sub">No notifications yet.</p>'}</section>`}
function profile(){let u=state.user;let fieldsOut=state.role==='student'?[['Register number',u.RegisterNumber],['Department',u.Department],['Year',u.Year]]:[['Employee ID',u.EmployeeID],['Designation',u.Designation],['Department',u.Department],['Availability',u.Availability]];return `<header class="page-head"><div><h1>Your Profile</h1><p class="sub">Your campus account details.</p></div></header><section class="card panel appointment-form"><div class="official-top"><div class="avatar">${esc(u.Name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div><h2>${esc(u.Name)}</h2><p class="sub">${esc(u.Email)}</p></div></div><hr><div class="form-grid">${fieldsOut.concat([['Contact number',u.ContactNumber]]).map(x=>`<div class="field"><label>${x[0]}</label><div>${esc(x[1])}</div></div>`).join('')}</div></section>`}
function availability(){return `<header class="page-head"><div><h1>Manage Availability</h1><p class="sub">Set the hours when students can request meetings.</p></div></header><form id="availabilityForm" class="card panel appointment-form">${['Monday','Tuesday','Wednesday','Thursday','Friday'].map(d=>`<div class="form-grid"><div class="field"><label>${d}</label><select name="${d}-enabled"><option value="true">Available</option><option value="false">Unavailable</option></select></div><div class="field"><label>Hours</label><input name="${d}-hours" value="09:00 - 17:00"></div></div>`).join('')}<button class="primary">Save Availability</button></form>`}
function modal(title,body){document.body.insertAdjacentHTML('beforeend',`<div class="modal"><div class="modal-box"><button id="closeModal" style="float:right">✕</button><h2>${title}</h2>${body}</div></div>`);$('#closeModal').onclick=()=>$('.modal').remove()}
function bind(){document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;render()});$('#switchMode')?.addEventListener('click',()=>{state.mode=state.mode==='login'?'signup':'login';render()});$('#authForm')?.addEventListener('submit',async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.role=state.role;try{let r=await run(state.mode==='login'?'login':state.role==='student'?'registerStudent':'registerOfficial',d);if(!r.success)return toast(r.message);toast(r.message);if(state.mode==='signup'){state.mode='login';render()}else{state.user=r.data;await load();render()}}catch(x){toast(x)}});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.selectedOfficial=null;render()});$('#logout')?.addEventListener('click',()=>{Object.assign(state,{user:null,mode:'login',view:'dashboard'});render()});$('#menu')?.addEventListener('click',()=>$('.sidebar').classList.toggle('open'));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});$('#officialSearch')?.addEventListener('input',e=>{state.query=e.target.value;render()});document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{state.selectedOfficial=state.officials.find(x=>x.OfficialID===b.dataset.select);$('.main').innerHTML=appointmentForm();bind()});$('#appointmentForm')?.addEventListener('submit',async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.studentId=state.user.id;d.officialId=state.selectedOfficial.OfficialID;let r=await run('createAppointment',d);toast(r.message);if(r.success){state.view='appointments';await load();render()}});document.querySelectorAll('[data-schedule]').forEach(b=>b.onclick=()=>schedule(b.dataset.schedule));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>reject(b.dataset.reject));$('#readAll')?.addEventListener('click',async()=>{let r=await run('markNotificationsRead',{userId:state.user.id});toast(r.message);await load();render()});$('#availabilityForm')?.addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target),items=['Monday','Tuesday','Wednesday','Thursday','Friday'].map(day=>{let [start,end]=f.get(day+'-hours').split('-').map(x=>x.trim());return{day,startTime:start,endTime:end,isAvailable:f.get(day+'-enabled')==='true'}});let r=await run('saveAvailability',{officialId:state.user.id,items});toast(r.message)});}
async function load(){let u=state.user;let [p,d,n,a]=await Promise.all([run('getProfile',{role:u.role,userId:u.id}),run('getDashboard',{role:u.role,userId:u.id}),run('getNotifications',{userId:u.id}),run('getAppointments',{role:u.role,userId:u.id})]);if(p.success)state.user=p.data;if(d.success)state.dashboard=d.data;if(n.success)state.notifications=n.data;if(a.success)state.appointments=a.data;if(u.role==='student'){let o=await run('getOfficials',{});state.officials=o.data||[]}}
async function schedule(id){let a=state.appointments.find(x=>x.AppointmentID===id);modal('Schedule appointment',`<p><b>${esc(a.StudentName)}</b> · ${esc(a.Purpose)}</p><form id="scheduleForm">${fields([['allocatedDate','Allocated Date','date'],['allocatedTime','Allocated Time','time'],['remarks','Remarks','textarea']])}<button class="primary">Confirm & Approve</button></form>`);$('#scheduleForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));Object.assign(d,{appointmentId:id,officialId:state.user.id,action:'approve'});let r=await run('updateAppointmentStatus',d);toast(r.message);if(r.success){$('.modal').remove();await load();render()}}}
function reject(id){modal('Reject appointment',`<form id="rejectForm">${fields([['remarks','Reason for rejection','textarea']])}<button class="primary">Reject Request</button></form>`);$('#rejectForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));Object.assign(d,{appointmentId:id,officialId:state.user.id,action:'reject'});let r=await run('updateAppointmentStatus',d);toast(r.message);if(r.success){$('.modal').remove();load().then(render)}}}
render();
</script></body></html>
